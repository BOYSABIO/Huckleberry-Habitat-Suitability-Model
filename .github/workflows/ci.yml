name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest numpy pandas "scikit-learn==1.6.1" joblib fastapi "uvicorn[standard]" httpx
      - name: Run tests
        run: pytest tests/ -v